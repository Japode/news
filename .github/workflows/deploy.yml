name: Build and deploy the site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # sitemap lastmod is the authored tree's last commit
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # typecheck, build, prerender, then scripts/verify.mjs: a failed check stops the deploy
      - name: Build
        run: npm run build

      # the visual gate (JN14): the built pages against the artboards in design/, both
      # rendered here by the pinned Playwright's Chromium; --self first proves the gate
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Visual gate
        run: npm run visual -- --self && npm run visual

      - name: Configure Pages
        uses: actions/configure-pages@v5

      # Only the build output is published, so docs/ and scripts/ are never served.
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # The deploy is its own job, as in GitHub's Pages starter workflow: in the build's job,
  # deploy-pages asked for the artifact right after the upload and was told there was none
  # (runs 45380460197 and 45390415105, 2026-11-24); a job that starts after the build has
  # finished finds it registered.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
